<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dino Dash</title>
<meta name="description" content="One button. Jump. A dino runner with worlds, power-ups, bosses, a daily run and dinos to unlock. Works offline.">
<meta name="theme-color" content="#f7f7f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f7f7f7; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; color: #535353; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .ui { position: fixed; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; z-index: 2; }
  #menu { bottom: calc(8vh + env(safe-area-inset-bottom)); }
  #over { bottom: calc(8vh + env(safe-area-inset-bottom)); }
  .ui button { font: 700 14px/1 inherit; font-family: inherit; letter-spacing: .06em; text-transform: uppercase; padding: 12px 16px; border: 3px solid currentColor; background: transparent; color: inherit; border-radius: 0; cursor: pointer; box-shadow: 3px 3px 0 currentColor; }
  .ui button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 currentColor; }
  .ui button.go { background: currentColor; }
  .ui button.go span { filter: invert(1); color: #535353; }
  #stats { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 14px; font-weight: 700; font-size: 13px; letter-spacing: .05em; z-index: 2; pointer-events: none; text-transform: uppercase; }
  #shop { position: fixed; inset: 0; z-index: 5; background: rgba(247, 247, 247, .97); overflow: auto; padding: 16px 16px 40px; color: #535353; }
  #shop h2 { margin: 6px 0 4px; font-size: 20px; letter-spacing: .1em; }
  #shop h3 { margin: 18px 0 8px; font-size: 13px; letter-spacing: .14em; opacity: .7; }
  .shop-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; max-width: 760px; margin: 0 auto; }
  .shop-body { max-width: 760px; margin: 0 auto; }
  .preview { display: flex; justify-content: center; margin: 10px 0; }
  .preview canvas { position: static; width: 220px; height: 140px; background: #fff; border: 3px solid #535353; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .item { border: 3px solid #535353; background: #fff; padding: 8px 6px; text-align: center; cursor: pointer; font: 700 12px/1.3 inherit; font-family: inherit; color: #535353; }
  .item canvas { position: static; width: 66px; height: 48px; display: block; margin: 0 auto 4px; }
  .item small { display: block; font-weight: 700; opacity: .8; }
  .item.on { background: #535353; color: #fff; }
  .item.locked { opacity: .55; }
  .item.cant { opacity: .3; }
  #toast { position: fixed; top: 28%; left: 50%; transform: translateX(-50%); font-weight: 800; letter-spacing: .08em; z-index: 6; pointer-events: none; opacity: 0; transition: opacity .3s; text-transform: uppercase; background: #535353; color: #fff; padding: 8px 12px; }
  #toast.show { opacity: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="c" aria-label="Dino Dash. Press space, click or tap to jump."></canvas>
<div id="stats"></div>
<div id="menu" class="ui">
  <button id="b-daily">Daily run</button>
  <button id="b-shop">Dinos</button>
  <button id="b-sound" aria-label="Sound">♪ On</button>
</div>
<div id="over" class="ui" hidden>
  <button id="b-shop2">Dinos</button>
  <button id="b-share">Share</button>
  <button id="b-home">Menu</button>
</div>
<section id="shop" hidden>
  <div class="shop-head"><h2>DINOS</h2><b id="shop-coins"></b><button class="item" id="shop-close" style="width:auto;padding:8px 14px">Done</button></div>
  <div class="shop-body">
    <div class="preview"><canvas id="pv" width="110" height="70"></canvas></div>
    <h3>SPECIES</h3><div class="grid" id="g-species"></div>
    <h3>COLOUR</h3><div class="grid" id="g-color"></div>
    <h3>HAT</h3><div class="grid" id="g-hat"></div>
  </div>
</section>
<div id="toast"></div>

<script>
'use strict';
// =====================================================================
// Dino Dash: one button. Everything else happens to you.
// =====================================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => { n = Math.imul(n ^ 61 ^ (n >>> 16), 9); n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); return ((n ^ (n >>> 15)) >>> 0) / 4294967296; };

const LEGS = {

    a: ['.....###..##..........', '.....##....##.........', '.....#................', '.....##...............'],

    b: ['...##.##......##.##...', '....#..##......#..##..', '....##.........##.....', '......................'] },
};
const HATS = {

  cap: ['..####..', '.######.', '########'],
  party: ['...k...', '...#...', '..###..', '..#o#..', '.#####.'],
  shades: ['.......', '######.', '##.###.'],
  crown: ['.k.k.k.', '.#####.', '.#o#o#.'],
  top: ['.####.', '.####.', '.####.', '.kkkk.', '######'],
  cowboy: ['..####..', '..####..', '########'],
  viking: ['k.####.k', 'k######k', '.######.'],

};
const PTERO = [[
  '.........#..............', '.........##.............', '.........###............', '....##...####...........', '...###...#####..........', '..####o..######.........',
  'k#############..........', '.....###############....', '........#########.......', '..........####..........', '........................', '........................', '........................'],
  ['........................', '........................', '........................', '....##..................', '...###..................', '..####o.................',
  'k#############..........', '.....###############....', '........#######.........', '.........#####..........', '..........###...........', '..........##............', '..........#.............']];

  shield: ['..#####..', '.#.....#.', '#..###..#', '#.#...#.#', '#.#...#.#', '#..###..#', '.#.....#.', '..#####..', '.........'],

const FONT = {
  '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111', '4': '101101111001001', '5': '111100111001111', '6': '111100111101111', '7': '111001010010010', '8': '111101111101111', '9': '111101111001111',
  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110', E: '111100110100111', F: '111100110100100', G: '011100101101011', H: '101101111101101', I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111', M: '101111111101101',
  N: '110101101101101', O: '010101101101010', P: '110101110100100', Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010', U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101', Y: '101101010010010', Z: '111001010100111',
  '!': '010010010000010', '+': '000010111010000', ':': '000010000010000', '-': '000000111000000', '.': '000000000000010', ' ': '000000000000000', "'": '010010000000000', '?': '111001010000010', '/': '001001010100100',
};

// ------------------------------------------------------------- sprite compiler (mask + tinted canvases)
const _tint = new Map();
function compile(rows) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const mask = new Uint8Array(w * h), kind = new Uint8Array(w * h);
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) { const c = r[x]; if (c === '.') continue; mask[y * w + x] = c === 'o' ? 0 : 1; kind[y * w + x] = c === '#' ? 1 : c === 'k' ? 2 : c === 'o' ? 3 : c === 'b' ? 4 : 1; if (c === 'o') mask[y * w + x] = 1; } });
  return { w, h, mask, kind, id: Math.random().toString(36).slice(2) };
}
function painted(spr, col, dark, eye) {
  const key = spr.id + col + dark + eye;
  let c = _tint.get(key); if (c) return c;
  c = document.createElement('canvas'); c.width = spr.w; c.height = spr.h; const x = c.getContext('2d');
  for (let i = 0; i < spr.w * spr.h; i++) { const k = spr.kind[i]; if (!k) continue; x.fillStyle = k === 1 || k === 4 ? col : k === 2 ? dark : eye; x.fillRect(i % spr.w, (i / spr.w) | 0, 1, 1); }
  if (_tint.size > 600) _tint.clear();
  _tint.set(key, c); return c;
}
function grid(w, h) { const g = Array.from({ length: h }, () => Array(w).fill('.')); g.out = () => g.map(r => r.join('')); return g; }
// procedural obstacles
function cactus(r, big) {
  const H = big ? 22 + (r() * 8 | 0) : 13 + (r() * 6 | 0), T = big ? 5 : 3, W = T + 8, g = grid(W, H), cx = 4;
  for (let y = 1; y < H; y++) for (let x = 0; x < T; x++) g[y][cx + x] = '#';
  for (let x = 1; x < T - 1; x++) g[0][cx + x] = '#';
  for (const side of [-1, 1]) { if (r() < .2) continue; const ay = 3 + (r() * (H * .45) | 0), len = 3 + (r() * 3 | 0), ax = side < 0 ? cx - 3 : cx + T + 1, aw = big ? 3 : 2;
    for (let y = ay; y < Math.min(H - 2, ay + len); y++) for (let x = 0; x < aw; x++) g[y][clamp(ax + x - (side < 0 ? 0 : 1) * 0, 0, W - 1)] = '#';
    const join = ay + len - 1; for (let x = Math.min(ax, cx); x < Math.max(ax + aw, cx + T); x++) if (x >= 0 && x < W) g[join][x] = '#'; g[ay][clamp(ax + (side < 0 ? 0 : aw - 1), 0, W - 1)] = '#'; }
  return g.out();
}
function rock(r, w, h) { const g = grid(w, h); for (let y = 0; y < h; y++) { const t = y / h, half = (w / 2) * Math.sqrt(Math.max(0, 1 - Math.pow(1 - t, 2) * .9)) + r() * .8; for (let x = 0; x < w; x++) if (Math.abs(x - w / 2 + .5) <= half) g[y][x] = '#'; } for (let k = 0; k < 3; k++) { const x = 1 + (r() * (w - 2) | 0), y = 2 + (r() * (h - 3) | 0); g[y][x] = 'k'; } return g.out(); }
function spikes(r, n) { const w = n * 6, h = 12 + (r() * 8 | 0), g = grid(w, h); for (let i = 0; i < n; i++) { const hh = h - (r() * 5 | 0); for (let y = 0; y < hh; y++) { const half = 3 * (y / hh); for (let x = 0; x < 6; x++) if (Math.abs(x - 2.5) <= half) g[h - hh + y][i * 6 + x] = y % 4 === 1 && x === 2 ? 'o' : '#'; } } return g.out(); }
function snowman() { return ['...kkk...', '..kkkkk..', '..#####..', '.##o#o##.', '.###k###.', '..#####..', '.#######.', '#########', '###kk####', '#########', '.#######.', '#########', '#########', '#########', '.#######.']; }
function logObs() { return ['.###############.', '##k###k####k####k', '#o############o##', '#################', '.###############.']; }
const CHOMP = [['...#####...', '..##k#k##..', '.#########.', '.k.k.k.k.k.', '...........', '.k.k.k.k.k.', '.#########.', '..#######..', '.....#.....', '...#.#.#...', '..##.#.##..', '.....#.....', '.....#.....', '.....#.....'],
  ['...#####...', '..##k#k##..', '.#########.', '.k.k.k.k.k.', '.#########.', '..#######..', '...........', '...........', '.....#.....', '...#.#.#...', '..##.#.##..', '.....#.....', '.....#.....', '.....#.....']];
function asteroid(r) { const s = 9 + (r() * 6 | 0), g = grid(s, s); for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) { const d = Math.hypot(x - s / 2 + .5, y - s / 2 + .5); if (d < s / 2 - r() * .6) g[y][x] = '#'; } for (let k = 0; k < 3; k++) { const x = 2 + (r() * (s - 4) | 0), y = 2 + (r() * (s - 4) | 0); g[y][x] = 'k'; } return g.out(); }
const UFO = [['.....###.....', '...#ooooo#...', '.###########.', '#k#k#k#k#k#k#', '.###########.', '...k.....k...'], ['.....###.....', '...#ooooo#...', '.###########.', '#.#k#k#k#k#.#', '.###########.', '...k.....k...']];

// ------------------------------------------------------------- worlds
const WORLDS = [
  { name: 'DESERT', sky: '#f7f7f7', ink: '#535353', far: '#e4e4e4', coin: '#c99a2e', night: { sky: '#202124', ink: '#bdc1c6', far: '#2d2f33', coin: '#f2c14e' }, obst: ['cactus', 'cactus', 'cactusBig', 'ptero'], decor: 'dunes', grav: 1 },
  { name: 'JUNGLE', sky: '#e6f4dc', ink: '#2e5d2c', far: '#c3dfb4', coin: '#c08a10', night: { sky: '#0f2416', ink: '#9fd39a', far: '#173322', coin: '#f2c14e' }, obst: ['log', 'chomp', 'rock', 'ptero'], decor: 'trees', grav: 1 },
  { name: 'ICE', sky: '#eaf6fd', ink: '#2f6788', far: '#cfe6f3', coin: '#c08a10', night: { sky: '#0c1b2a', ink: '#bfe3fa', far: '#14293d', coin: '#f2c14e' }, obst: ['spikes', 'snowman', 'spikes', 'ptero'], decor: 'peaks', grav: 1, snow: true },
  { name: 'VOLCANO', sky: '#2c1714', ink: '#f0a46b', far: '#4a2420', coin: '#ffd25a', night: { sky: '#160807', ink: '#ff9a5a', far: '#2c110e', coin: '#ffd25a' }, obst: ['rock', 'rock', 'spikes', 'ptero'], decor: 'volcano', grav: 1, embers: true },
  { name: 'SPACE', sky: '#0b0d22', ink: '#c9ccff', far: '#1b1f45', coin: '#ffe07a', night: { sky: '#05060f', ink: '#c9ccff', far: '#12153a', coin: '#ffe07a' }, obst: ['asteroid', 'asteroid', 'rock', 'ufo'], decor: 'planets', grav: .75, stars: true },
];
const WORLD_LEN = 600;

// ------------------------------------------------------------- shop
const SPECIES = [['rex', 'T-Rex', 0], ['raptor', 'Raptor', 150], ['trike', 'Triceratops', 300], ['stego', 'Stegosaurus', 500]];
const COLORS = [['classic', 'Classic', 0, null], ['green', 'Leaf', 40, '#4a9a3a'], ['blue', 'Ocean', 40, '#3a7ad0'], ['red', 'Ember', 60, '#d0453a'], ['purple', 'Grape', 80, '#8a4ad0'], ['pink', 'Bubblegum', 80, '#e070a8'], ['white', 'Ghost', 150, '#f4f4f4'], ['black', 'Shadow', 200, '#1c1c1e'], ['gold', 'Gold', 400, '#e0b030'], ['rainbow', 'Rainbow', 800, 'rainbow']];
const HAT_LIST = [['none', 'No hat', 0], ['cap', 'Cap', 30], ['party', 'Party', 50], ['shades', 'Shades', 70], ['top', 'Top hat', 120], ['cowboy', 'Cowboy', 120], ['viking', 'Viking', 200], ['crown', 'Crown', 300], ['halo', 'Halo', 400]];
const HAT_COL = { cap: '#d0453a', party: '#3a7ad0', shades: '#1c1c1e', top: '#1c1c1e', cowboy: '#8a5a2a', viking: '#9a9aa2', crown: '#e0b030', halo: '#f2d460', none: '#000' };

// ------------------------------------------------------------- compiled sprites
const S = { dino: {}, legs: {}, hats: {}, icons: {}, ptero: PTERO.map(compile), chomp: CHOMP.map(compile), ufo: UFO.map(compile), log: compile(logObs()), snowman: compile(snowman()) };
for (const k in ART) S.dino[k] = compile(ART[k].top);
for (const k in LEGS) { S.legs[k] = {}; for (const f in LEGS[k]) S.legs[k][f] = compile(LEGS[k][f]); }
for (const k in HATS) if (HATS[k]) S.hats[k] = compile(HATS[k]);
for (const k in ICONS) S.icons[k] = compile(ICONS[k]);
for (const k in FONT) { const b = FONT[k]; FONT[k] = []; for (let i = 0; i < 15; i++) if (b[i] === '1') FONT[k].push([i % 3, (i / 3) | 0]); }
// full-body masks for the dino, cached per species+frame
const _body = new Map();
function bodySprite(sp, frame) {
  const key = sp + frame; let b = _body.get(key); if (b) return b;
  const A = ART[sp], L = LEGS[A.legs][frame === 'dead' ? 'stand' : frame];
  let rows = A.top.concat(L);
  if (frame === 'dead') { const [ex, ey] = A.dead; rows = rows.map((r, y) => y === ey ? r.slice(0, ex) + 'k' + r.slice(ex + 1) : r).map(r => r.replace('o', '#')); }
  b = compile(rows); _body.set(key, b); return b;
}

// ------------------------------------------------------------- save
const SAVE_KEY = 'dino-dash-v1';
const save = Object.assign({ best: 0, coins: 0, owned: { rex: 1, classic: 1, none: 1 }, sp: 'rex', col: 'classic', hat: 'none', daily: {}, sound: true, runs: 0 }, (() => { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; } })());
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

// ------------------------------------------------------------- audio (tiny square-wave blips, like the original)
const Snd = {
  ctx: null,
  init() { if (this.ctx) return; try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} },
  beep(f, d, type = 'square', vol = .06, slide = 1, delay = 0) { if (!this.ctx || !save.sound) return; const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (slide !== 1) o.frequency.exponentialRampToValueAtTime(f * slide, t + d); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .02); },
  noise(d, vol = .1) { if (!this.ctx || !save.sound) return; const c = this.ctx, n = c.sampleRate * d, b = c.createBuffer(1, n, c.sampleRate), a = b.getChannelData(0); for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = c.createBufferSource(), g = c.createGain(); s.buffer = b; g.gain.value = vol; s.connect(g); g.connect(c.destination); s.start(); },
  jump() { this.beep(520, .09, 'square', .05, 1.6); },
  coin() { this.beep(988, .05, 'square', .035); this.beep(1319, .09, 'square', .035, 1, .05); },
  point() { this.beep(880, .06, 'square', .04); this.beep(1175, .1, 'square', .04, 1, .07); },
  die() { this.beep(160, .3, 'square', .07, .5); this.noise(.25, .08); },
  power() { [523, 659, 784, 1046].forEach((f, i) => this.beep(f, .09, 'square', .04, 1, i * .06)); },
  pop() { this.noise(.15, .1); this.beep(300, .15, 'triangle', .08, .5); },

  if (w.stars || isNight((G && G.score) || 0)) { lx.fillStyle = PAL.ink; for (let i = 0; i < 40; i++) { const sx = ((hash(i * 7) * W * 2 - scroll * .03) % (W + 20) + W + 20) % (W + 20) - 10, sy = hash(i * 13) * (GROUND - 30); if (hash(i + 99) < .5 + .5 * Math.sin(t * 2 + i)) lx.fillRect(Math.round(sx), Math.round(sy), 1, 1); } if (!w.stars) { lx.fillRect(W - 50, 14, 8, 8); lx.fillStyle = PAL.sky; lx.fillRect(W - 47, 13, 6, 7); } lx.fillStyle = PAL.far; }
  const par = scroll * .18;
  for (let i = -1; i < W / 60 + 2; i++) {
    const base = Math.floor(par / 60) + i, x0 = i * 60 - (par % 60), hv = hash(base * 31 + 5);
    if (kind === 'dunes') { const h = 8 + hv * 14; for (let x = 0; x < 60; x++) { const yy = Math.sin((x / 60) * Math.PI) * h; lx.fillRect(Math.round(x0 + x), Math.round(GROUND - yy), 1, Math.ceil(yy)); } }
    else if (kind === 'trees') { const h = 20 + hv * 22, tx = x0 + 20 + hv * 20; lx.fillRect(Math.round(tx), Math.round(GROUND - h), 3, Math.ceil(h)); for (let r = 0; r < 3; r++) { const rr = 9 - r * 2; lx.fillRect(Math.round(tx - rr + 1), Math.round(GROUND - h - 4 + r * 5), rr * 2, 5); } }
    else if (kind === 'peaks') { const h = 18 + hv * 26; for (let x = 0; x < 60; x++) { const yy = Math.max(0, h - Math.abs(x - 30) * h / 30); lx.fillRect(Math.round(x0 + x), Math.round(GROUND - yy), 1, Math.ceil(yy)); } lx.fillStyle = PAL.sky; for (let x = 22; x < 38; x++) { const yy = Math.max(0, h - Math.abs(x - 30) * h / 30); if (yy > h - 6) lx.fillRect(Math.round(x0 + x), Math.round(GROUND - yy), 1, 2); } lx.fillStyle = PAL.far; }
    else if (kind === 'volcano') { if (hv < .35) { const h = 34 + hv * 30; for (let x = 0; x < 60; x++) { const yy = Math.max(0, Math.min(h, h * 1.6 - Math.abs(x - 30) * h / 22)); lx.fillRect(Math.round(x0 + x), Math.round(GROUND - yy), 1, Math.ceil(yy)); } lx.fillStyle = '#ff6a2a'; lx.fillRect(Math.round(x0 + 26), Math.round(GROUND - h), 8, 2); lx.fillStyle = PAL.far; } else { const h = 6 + hv * 8; lx.fillRect(Math.round(x0), Math.round(GROUND - h), 60, Math.ceil(h)); } }
    else if (kind === 'planets') { if (hv < .25) { const r = 6 + hv * 30, px = x0 + 30, py = 20 + hv * 40; for (let y = -r; y <= r; y++) { const hw = Math.sqrt(r * r - y * y); lx.fillRect(Math.round(px - hw), Math.round(py + y), Math.round(hw * 2), 1); } } }
  }
  // clouds (not in space)
  if (kind !== 'planets') { lx.fillStyle = kind === 'volcano' ? '#5a2a24' : PAL.far; for (let i = 0; i < 4; i++) { const cxp = ((hash(i * 3 + 1) * W * 3 - scroll * .08) % (W + 60) + W + 60) % (W + 60) - 30, cyp = 10 + hash(i * 5) * (GROUND - 60); lx.fillRect(Math.round(cxp), Math.round(cyp + 2), 22, 4); lx.fillRect(Math.round(cxp + 5), Math.round(cyp), 10, 3); } }
  // weather
  if (w.snow) { lx.fillStyle = '#ffffff'; for (let i = 0; i < 50; i++) { const sx = ((hash(i * 17) * W - scroll * .3 + Math.sin(t + i) * 6) % W + W) % W, sy = ((hash(i * 3) * H + t * (12 + hash(i) * 10)) % GROUND); lx.fillRect(Math.round(sx), Math.round(sy), 1, 1); } }
  if (w.embers) { for (let i = 0; i < 30; i++) { lx.fillStyle = i % 2 ? '#ff8a3a' : '#ffcf5a'; const sx = ((hash(i * 17) * W - scroll * .4) % W + W) % W, sy = GROUND - ((hash(i * 3) * GROUND + t * (10 + hash(i) * 14)) % GROUND); lx.fillRect(Math.round(sx), Math.round(sy), 1, 1); } }
}
function drawGround(scroll) {
  lx.fillStyle = PAL.ink;
  lx.fillRect(0, GROUND, W, 1);
  for (let x = 0; x < W; x++) {
    const wx = Math.floor(x + scroll), h1 = hash(wx);
    if (h1 < .06) lx.fillRect(x, GROUND - 1, 1, 1);
    if (h1 > .92) lx.fillRect(x, GROUND + 3 + ((hash(wx * 7) * 6) | 0), (h1 * 10 | 0) % 3 + 1, 1);
    if (h1 > .985) lx.fillRect(x, GROUND + 9 + ((hash(wx * 3) * 8) | 0), 2, 1);

function drawIcon(k, x, y, col) { const s = S.icons[k]; lx.drawImage(painted(s, col, col, col), Math.round(x), Math.round(y)); }
function render(dt) {
  PAL = currentPal();
  const t = performance.now() / 1000, scroll = G && G.dist != null ? G.dist : t * 40;
  lx.fillStyle = PAL.sky; lx.fillRect(0, 0, W, H);
  drawDecor(t, scroll);
  drawGround(scroll);
  if (G && G.state !== 'title') {
    // best-score flag
    if (G.mode === 'endless' && save.best > 50 && !G.passedBest) { const fx = DX + (G.bestFlag - G.score) * 20; if (fx < W + 5 && fx > -10) { lx.fillStyle = PAL.ink; lx.fillRect(Math.round(fx), GROUND - 22, 1, 22); lx.fillStyle = '#d0453a'; lx.fillRect(Math.round(fx) + 1, GROUND - 22, 9, 6); text('HI', fx + 2, GROUND - 21, '#fff'); } }
    // big rex chasing
    if (G.rex) { const bob = Math.abs(Math.sin(G.t * 9)) * 3; drawDino(G.rex.x, GROUND - bodySprite('rex', 'a').h * 3 + bob, 'rex', Math.floor(G.t * 9) % 2 ? 'a' : 'b', '#7a2a1a', 'none', 1, 3); if (Math.sin(G.t * 3) > .7) text('RAWR!', G.rex.x + 50, GROUND - 76, '#d0453a', 2); }
    // meteors
    for (const m of G.meteors) { lx.fillStyle = '#ff8a2a'; lx.fillRect(Math.round(m.x - 3), Math.round(GROUND - 60 * (1 - (m.t / m.dur) ** 2) - 3), 6, 6); lx.fillStyle = '#ffe07a'; lx.fillRect(Math.round(m.x - 1), Math.round(GROUND - 60 * (1 - (m.t / m.dur) ** 2) - 1), 3, 3); const sh = Math.round(4 + 8 * m.t / m.dur); lx.fillStyle = 'rgba(0,0,0,.25)'; lx.fillRect(Math.round(m.tx - sh / 2), GROUND + 1, sh, 2); }

    // power-ups
    for (const p of G.pups) { const py = GROUND - p.y - 9 + Math.sin(p.t * 4) * 2; lx.fillStyle = PAL.coin; lx.fillRect(Math.round(p.x) - 2, Math.round(py) - 2, 13, 13); lx.fillStyle = PAL.sky; lx.fillRect(Math.round(p.x) - 1, Math.round(py) - 1, 11, 11); drawIcon(p.k, p.x, py, PAL.ink); if (Math.sin(t * 8) > 0) { lx.fillStyle = PAL.coin; lx.fillRect(Math.round(p.x) + 4, Math.round(py) - 5, 1, 2); } }
    // obstacles
    for (const o of G.obs) { const oy = GROUND - o.h - o.y; const col = o.hot ? '#3a2018' : PAL.ink; lx.drawImage(painted(o.spr, col, o.kind === 'chomp' ? '#d0453a' : PAL.sky === '#f7f7f7' ? '#2a2a2a' : PAL.sky, '#ffffff'), Math.round(o.x), Math.round(oy)); if (o.hot && Math.random() < .3) G.parts.push({ x: o.x + Math.random() * o.w, y: oy, vx: 0, vy: -20, life: .5, col: '#ff8a2a', s: 1 }); }
    // ghost of your best daily run
    if (G.ghost && G.state === 'play') { const i = Math.floor(G.t / .05); if (i < G.ghost.length) { const gy = G.ghost[i]; drawDino(DX, GROUND - bodySprite(save.sp, 'stand').h - gy, save.sp, 'stand', '#8ab0e0', 'none', .35); } else if (i < G.ghost.length + 40) text('YOUR GHOST FELL HERE', DX - 6, GROUND - 40, '#8ab0e0'); }
    // the dino
    const d = G.d, dead = G.state === 'dead';
    const frame = dead ? 'dead' : d.ground ? (Math.floor(G.t * (G.speed / 14)) % 2 ? 'a' : 'b') : 'stand';
    const spr = bodySprite(save.sp, frame);
    let dy = GROUND - spr.h - Math.round(d.y);
    const blink = d.inv > 0 && Math.floor(t * 16) % 2;
    if (G.fx.dash > 0) for (let k = 1; k <= 3; k++) drawDino(DX - k * 6, dy, save.sp, frame, '#ff8a2a', save.hat, .25);
    if (!blink) drawDino(DX, dy, save.sp, frame, save.col === 'rainbow' ? rainbowHex(t) : dinoColor(t), save.hat, 1);
    if (G.fx.shield > 0) { lx.strokeStyle = '#5ab0ff'; lx.globalAlpha = .7 + Math.sin(t * 6) * .2; lx.beginPath(); lx.arc(DX + spr.w / 2, dy + spr.h / 2, 15, 0, TAU); lx.stroke(); lx.globalAlpha = 1; }
    if (G.fx.wings > 0 && !dead) { lx.fillStyle = '#ffffff'; const fl = Math.sin(t * 20) > 0 ? -2 : 1; lx.fillRect(DX + 4, dy + 8 + fl, 6, 2); lx.fillRect(DX + 2, dy + 7 + fl * 2, 4, 1); }

    lx.globalAlpha = 1;

    const sc = String(Math.floor(G.score)).padStart(5, '0'), hi = String(Math.max(save.best, G.mode === 'endless' ? Math.floor(G.score) : 0)).padStart(5, '0');

    text((G.mode === 'daily' ? 'DAILY ' : 'HI ') + (G.mode === 'daily' ? String(save.daily[today()]?.score || 0).padStart(5, '0') : hi), W - 30, 6, mixHex(PAL.ink, PAL.sky, .4), 1, 'right');

    let px = 6;
    for (const k of ['shield', 'magnet', 'wings', 'slow', 'dash', 'double']) { const v = G.fx[k]; if (v <= 0) continue; drawIcon(k, px, 14, PAL.ink); if (k !== 'shield') { lx.fillStyle = PAL.coin; lx.fillRect(px, 24, Math.round(9 * v / PUP_TIME[k]), 1); } px += 12; }
    if (G.banner && !dead) { const b = G.banner, a = b.t < 2 ? 1 : 1 - (b.t - 2) / .4; lx.globalAlpha = clamp(a, 0, 1); const s = W > 260 ? 2 : 1; text(b.text, W / 2, Math.max(18, GROUND - 66) - Math.min(1, b.t * 4) * 4, PAL.ink, s, 'center'); lx.globalAlpha = 1; }

      if (G.result) { text(`+${G.result.coins} COINS${G.near ? `  ${G.near} CLOSE CALLS` : ''}`, W / 2, ry + 20, PAL.coin, 1, 'center'); if (G.result.wasBest) text('NEW BEST!', W / 2, ry + 28, '#d0453a', 1, 'center'); }
    }

    // title screen: the dino idles, blinking, like the original

    const s = W > 260 ? 3 : 2;
    text('DINO DASH', W / 2, Math.max(8, GROUND - 90), PAL.ink, s, 'center');
    text(matchMedia('(pointer: coarse)').matches ? 'TAP TO JUMP' : 'PRESS SPACE OR CLICK', W / 2, Math.max(8, GROUND - 90) + 9 * s, PAL.ink, 1, 'center');
    if (!navigator.onLine) text("NO INTERNET? PERFECT.", W / 2, Math.max(8, GROUND - 90) + 9 * s + 9, PAL.coin, 1, 'center');
    text(`HI ${String(save.best).padStart(5, '0')}`, W - 6, 6, PAL.ink, 1, 'right');

  cx.fillStyle = PAL.sky; cx.fillRect(0, 0, cv.width, cv.height);

// ------------------------------------------------------------- UI (menus outside the one button)
const $ = s => document.querySelector(s);
function showUI() {
  const st = G ? G.state : 'title';
  $('#menu').hidden = st !== 'title'; $('#over').hidden = st !== 'dead';
  $('#stats').textContent = '';
  $('#b-sound').textContent = save.sound ? '♪ On' : '♪ Off';
}
function start(mode) { newRun(mode); showUI(); if (mode === 'daily') banner('DAILY RUN ' + today().slice(5)); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800); }
const stop = e => { e.stopPropagation(); Snd.init(); };
for (const b of document.querySelectorAll('.ui button')) b.addEventListener('pointerdown', stop);
$('#b-daily').onclick = () => start('daily');
$('#b-sound').onclick = () => { save.sound = !save.sound; persist(); showUI(); };
$('#b-home').onclick = () => { G = { state: 'title' }; showUI(); };
$('#b-shop').onclick = $('#b-shop2').onclick = () => openShop();
$('#b-share').onclick = async () => {
  const r = G && G.result; if (!r) return;
  const txt = G.mode === 'daily' ? `Dino Dash daily run ${today()}: ${r.sc} 🦖 Can you beat it?` : `I ran ${r.sc} in Dino Dash 🦖 Can you beat it?`;
  const url = location.href.split('#')[0];
  try { if (navigator.share) await navigator.share({ text: txt, url }); else { await navigator.clipboard.writeText(txt + ' ' + url); toast('Copied to clipboard'); } } catch (e) {}
};
// shop
function itemCanvas(draw) { const c = document.createElement('canvas'); c.width = 33; c.height = 24; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; draw(x); return c; }
function openShop() {
  $('#shop').hidden = false; renderShop();
}
function renderShop() {
  PAL = palFor(0);
  $('#shop-coins').textContent = `● ${save.coins} coins`;
  const groups = [['#g-species', SPECIES, 'sp'], ['#g-color', COLORS, 'col'], ['#g-hat', HAT_LIST, 'hat']];
  for (const [sel, list, slot] of groups) {
    const box = $(sel); box.innerHTML = '';
    for (const [id, name, price] of list) {
      const owned = !!save.owned[id], on = save[slot] === id;
      const b = document.createElement('button'); b.className = 'item' + (on ? ' on' : owned ? '' : save.coins >= price ? ' locked' : ' cant');
      const sp = slot === 'sp' ? id : save.sp, col = slot === 'col' ? id : save.col, hat = slot === 'hat' ? id : save.hat;
      b.appendChild(itemCanvas(x => { const c = COLORS.find(q => q[0] === col); drawDino(4, 24 - bodySprite(sp, 'stand').h, sp, 'stand', c[3] === 'rainbow' ? '#e070a8' : c[3] || '#535353', hat, 1, 1, x); }));
      b.insertAdjacentHTML('beforeend', `${name}<small>${on ? 'WEARING' : owned ? 'OWNED' : '● ' + price}</small>`);

        if (owned) { save[slot] = id; }
        else if (save.coins >= price) { save.coins -= price; save.owned[id] = 1; save[slot] = id; Snd.init(); Snd.power(); toast(`Unlocked ${name}!`); }
        else { toast(`Need ${price - save.coins} more coins`); return; }
        persist(); renderShop();
      };
      box.appendChild(b);
    }
  }
}
$('#shop-close').onclick = () => { $('#shop').hidden = true; };
(function previewLoop() {
  if (!$('#shop').hidden) { const c = $('#pv'), x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height); x.fillStyle = '#535353'; x.fillRect(0, 56, c.width, 1); const t = performance.now() / 1000, j = Math.max(0, Math.sin(t * 3)) * 14; const f = j > 0 ? 'stand' : Math.floor(t * 10) % 2 ? 'a' : 'b'; const col = save.col === 'rainbow' ? rainbowHex(t) : (COLORS.find(q => q[0] === save.col)[3] || '#535353'); drawDino(40, 56 - bodySprite(save.sp, f).h - j, save.sp, f, col, save.hat, 1, 1, x); }

})();

// ------------------------------------------------------------- loop
G = { state: 'title' }; showUI();
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (G && G.state === 'play') { const steps = Math.ceil(dt / .01); for (let i = 0; i < steps; i++) { update(dt / steps); if (G.state !== 'play') break; } }

requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => { last = performance.now(); });

// offline: cache everything so it works with no internet

// test hook
window.__dino = { get G() { return G; }, start, press, release, update, save, setG: g => { G = g; } };
